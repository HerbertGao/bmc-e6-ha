name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: offline tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The shared protocol package needs cryptography; bleak is imported lazily
      # inside the BLE client, so the offline suite does not require it.
      - name: Install dependencies
        run: python -m pip install --upgrade pip cryptography

      - name: Run offline tests
        run: python -m unittest discover -s tests -t tests

      - name: Validate JSON resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "hacs.json",
              "custom_components/bmc_e6/manifest.json",
              "custom_components/bmc_e6/strings.json",
              "custom_components/bmc_e6/translations/en.json",
              "custom_components/bmc_e6/translations/zh-Hans.json",
          ]
          for name in files:
              json.loads(Path(name).read_text())
              print(f"ok {name}")

          zh = json.loads(Path("custom_components/bmc_e6/translations/zh-Hans.json").read_text())
          en = json.loads(Path("custom_components/bmc_e6/translations/en.json").read_text())
          missing = set(en.get("entity", {}).get("sensor", {})) - set(zh.get("entity", {}).get("sensor", {}))
          if missing:
              raise SystemExit(f"zh-Hans is missing sensor keys: {sorted(missing)}")
          print("translation keys in sync")
          PY
